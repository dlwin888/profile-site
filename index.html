<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1 id="title">你好，我是你的名字</h1>
    <p id="subtitle">正在从零到全栈</p>
    <button id="themeBtn">切换主题</button>
  </header>

  <main>
    <section>
      <h2>关于我</h2>
      <p>我是一名正在学习全栈开发的开发者。</p>
    </section>

    <section>
      <h2>项目</h2>
      <ul>
        <li>个人主页</li>
        <li>文字实验室（即将上线）</li>
      </ul>
    </section>
    <section id="lab">
    <h2>文字实验室</h2>
    <p class="hint">输入一段文字，看看它有多少字、多少词，以及反转后的样子。</p>
    <textarea id="labInput" rows="5" placeholder="在这里输入一段文字..."></textarea>
    <div class="lab-actions">
        <button id="analyzeBtn">分析</button>
        <button id="clearBtn" class="secondary">清空</button>
    </div>
    <div id="labResult" class="lab-result" hidden></div>
    <div class="history">
      <h3>最近记录</h3>
      <ul id="historyList"><li>加载中…</li></ul>
    </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> 我的个人主页</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
